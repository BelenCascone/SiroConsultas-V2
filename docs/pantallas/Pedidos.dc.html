<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pedidos de turno online</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F2F7F9}
a{color:#24605F}a:hover{color:#02261E}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #24605F;outline-offset:2px}
@media (prefers-reduced-motion: no-preference){.paso{animation:entra .28s cubic-bezier(.2,.7,.2,1)}}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; box-sizing: border-box; padding: 24px 40px 56px; background: radial-gradient(520px 260px at 18% 0%, rgba(137,201,201,0.34), transparent 70%), radial-gradient(440px 240px at 72% 4%, rgba(218,252,146,0.50), transparent 70%), #F2F7F9; color: #02261E; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; gap: 28px;">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 12px; border-radius: 999px; background: rgba(255,255,255,0.88); color: #02261E; text-decoration: none; font-weight: 600; box-shadow: 0 1px 2px rgba(2,38,30,0.06);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      Volver a Hoy
    </a>
    <a href="#" style="display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; background: rgba(255,255,255,0.88); color: #02261E; text-decoration: none; font-weight: 600; box-shadow: 0 1px 2px rgba(2,38,30,0.06);">Ver mi página para pedir turno</a>
  </header>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;">
    <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em;">Pedidos de turno</h1>
    <span style="color: #4A5F5C; max-width: 56ch;">{{subtitulo}}</span>
  </div>

  <div style="width: 100%; max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; align-items: start;">
    <sc-for list="{{pedidos}}" as="p" hint-placeholder-count="3">
      <section style="background: #FFFFFF; border-radius: 26px; padding: 22px; box-shadow: 0 1px 2px rgba(2,38,30,0.05), 0 16px 40px rgba(2,38,30,0.07); display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
          <span style="font-size: 13px; color: #4A5F5C; font-weight: 600;">{{p.hace}}</span>
          <span style="{{p.chip}}">{{p.estado}}</span>
        </div>
        <div style="display: flex; flex-direction: column; line-height: 1.3;">
          <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em;">{{p.nombre}}</span>
          <span style="font-weight: 600; margin-top: 4px;">{{p.cuando}}</span>
          <span style="font-size: 14px; color: #4A5F5C;">{{p.prestacion}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 16px; background: #E9F1F3; font-size: 14px;">
          <span>DNI {{p.dni}} · {{p.cel}}</span>
          <span style="color: #4A5F5C;">{{p.mail}} · {{p.cobertura}}</span>
        </div>
        <span style="{{p.fichaStyle}}">{{p.ficha}}</span>

        <sc-if value="{{p.abierto}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <button type="button" onClick="{{p.aceptar}}" style="height: 52px; border-radius: 16px; border: 0; background: #DAFC92; color: #02261E; font-size: 16px; font-weight: 800;">Aceptar</button>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
              <button type="button" onClick="{{p.proponer}}" style="height: 44px; border-radius: 14px; border: 0; background: #DCEFEF; color: #24605F; font-size: 14px; font-weight: 700;">Otro horario</button>
              <button type="button" onClick="{{p.rechazar}}" style="height: 44px; border-radius: 14px; border: 0; background: #E9F1F3; color: #02261E; font-size: 14px; font-weight: 600;">No puedo</button>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{p.proponiendo}}" hint-placeholder-val="{{false}}">
          <div class="paso" style="display: flex; flex-direction: column; gap: 10px;">
            <span style="font-size: 13px; color: #4A5F5C;">Elegí hasta 3 horarios para ofrecerle</span>
            <div style="display: flex; flex-wrap: wrap; gap: 6px;">
              <sc-for list="{{p.horarios}}" as="h" hint-placeholder-count="4">
                <button type="button" onClick="{{h.tocar}}" aria-pressed="{{h.on}}" style="{{h.style}}">{{h.label}}</button>
              </sc-for>
            </div>
            <button type="button" onClick="{{p.enviarPropuesta}}" style="{{p.enviarStyle}}">{{p.enviarTxt}}</button>
          </div>
        </sc-if>
        <sc-if value="{{p.cerrado}}" hint-placeholder-val="{{false}}">
          <div class="paso" role="status" style="{{p.resStyle}}">
            <span>{{p.resTexto}}</span>
            <button type="button" onClick="{{p.reabrir}}" style="align-self: flex-start; min-height: 40px; border: 0; background: transparent; padding: 0; color: inherit; font-size: 14px; font-weight: 700; text-decoration: underline;">Deshacer</button>
          </div>
        </sc-if>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = Object.assign({ res: {}, prop: null, sel: ['Lun 27 · 9:30', 'Mar 28 · 16:00'] }, this.state || {});
    var datos = [
      { nombre: 'Sofía Herrera', cuando: 'Viernes 24/10 · 10:00', prestacion: 'Primera consulta · Consultorio Centro', hace: 'Hace 3 h', vence: 'Vence en 9 h', dni: '40.123.456', cel: '11 5555-0177', mail: 'sofia.h@correo.com', cobertura: 'Particular', nueva: true },
      { nombre: 'Elena Castro', cuando: 'Martes 28/10 · 9:00', prestacion: 'Evolución · Consultorio Centro', hace: 'Hace 1 h', vence: 'Vence en 11 h', dni: '22.333.444', cel: '11 5555-0123', mail: 'elena.castro@correo.com', cobertura: 'Swiss Medical', nueva: false, veces: 6, ultima: '12/09' },
      { nombre: 'Javier Ortiz', cuando: 'Miércoles 29/10 · 18:00', prestacion: 'Control · Consultorio Norte', hace: 'Hace 10 h', vence: 'Vence en 2 h', dni: '35.777.888', cel: '11 5555-0166', mail: 'sin correo', cobertura: 'OSDE', nueva: true }
    ];
    var EST = { aceptado: ['Confirmado', 'background:#E4F4EA;color:#166534;'], propuesto: ['Propuesta enviada', 'background:#DCEFEF;color:#24605F;'], rechazado: ['Rechazado', 'background:#ECEFF3;color:#475467;'] };
    var RES = {
      aceptado: 'Le llegó la confirmación por WhatsApp y correo.',
      propuesto: 'Le llegaron los horarios para elegir. El original quedó libre.',
      rechazado: 'Le avisamos que ese horario no está disponible.'
    };
    var RES_ST = { aceptado: 'background: #E4F4EA; color: #166534;', propuesto: 'background: #DCEFEF; color: #24605F;', rechazado: 'background: #ECEFF3; color: #475467;' };
    var pedidos = datos.map(function (d, i) {
      var r = s.res[i];
      var marca = function (v) { return function () { var n = Object.assign({}, s.res); n[i] = v; self.setState({ res: n, prop: null }); }; };
      var reabrir = function () { var n = Object.assign({}, s.res); delete n[i]; self.setState({ res: n }); };
      var e = r ? EST[r] : [d.vence, i === 2 ? 'background:#FDE8E8;color:#9E2016;' : 'background:#EFEAF6;color:#5B3F8C;'];
      var prop = s.prop === i && !r;
      return Object.assign({}, d, {
        estado: e[0], chip: 'font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap;' + e[1],
        ficha: d.nueva ? 'Nunca vino: sería su primera consulta.' : 'Ya vino ' + d.veces + ' veces · la última el ' + d.ultima + '.',
        fichaStyle: 'font-size: 13px; line-height: 1.4; padding: 10px 12px; border-radius: 14px; ' + (d.nueva ? 'background: #E5F2FF; color: #1D5FB8;' : 'background: #E4F4EA; color: #166534;'),
        horarios: ['Lun 27 · 9:30', 'Mar 28 · 16:00', 'Mié 29 · 11:00', 'Jue 30 · 17:30'].map(function (h) {
          var on = s.sel.indexOf(h) >= 0, lleno = !on && s.sel.length >= 3;
          return { label: h, on: on ? 'true' : 'false',
            tocar: function () { if (lleno) return; self.setState({ sel: on ? s.sel.filter(function (x) { return x !== h; }) : s.sel.concat([h]) }); },
            style: 'min-height: 44px; padding: 0 14px; border-radius: 999px; border: 0; font-size: 14px; ' + (on ? 'background: #02261E; color: #FFFFFF; font-weight: 700;' : 'background: #E9F1F3; color: #02261E; font-weight: 600;' + (lleno ? ' opacity: 0.5; cursor: default;' : '')) };
        }),
        enviarTxt: s.sel.length ? 'Enviar ' + (s.sel.length === 1 ? 'el horario' : 'los ' + s.sel.length + ' horarios') : 'Elegí al menos un horario',
        enviarStyle: 'height: 48px; border-radius: 16px; border: 0; font-size: 15px; font-weight: 700; ' + (s.sel.length ? 'background: #02261E; color: #FFFFFF;' : 'background: #E9F1F3; color: #4A5F5C; cursor: default;'),
        abierto: !r && !prop, proponiendo: prop, cerrado: !!r,
        aceptar: marca('aceptado'), rechazar: marca('rechazado'), enviarPropuesta: function () { if (s.sel.length) marca('propuesto')(); },
        proponer: function () { self.setState({ prop: i, sel: [] }); }, reabrir: reabrir,
        resTexto: r ? RES[r] : '', resStyle: 'display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 16px; font-size: 14px; ' + (r ? RES_ST[r] : '')
      });
    });
    var faltan = datos.length - Object.keys(s.res).length;
    return {
      pedidos: pedidos,
      subtitulo: faltan ? 'Tenés ' + faltan + ' para responder. Cada horario queda reservado 12 horas; si no respondés, se libera y al paciente le llega un aviso.' : 'No tenés pedidos para responder.'
    };
  }
}
</script>
</body>
</html>
